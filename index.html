<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Parsec — JSON Viewer & Toolkit</title>
  <meta name="description" content="Inspect, format, convert, diff and graph JSON documents in the browser." />

  <!-- app icon / favicon — the hrefs are theme-swapped at runtime (lib/favicon.js).
       No .ico link: browsers would prefer it and ignore the theme-specific PNGs.
       /favicon.ico is still served for clients that probe the root path. -->
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" data-favicon="48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" data-favicon="32" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" data-favicon="16" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#3B4A6B" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131316" />

  <!-- Paint the page background before React mounts, so a dark-mode load does
       not flash white. Mirrors the store's rule: saved choice wins, else OS. -->
  <style>
    html { background: #FAFAF9; color-scheme: light; }
    @media (prefers-color-scheme: dark) { html { background: #131316; color-scheme: dark; } }
  </style>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('parsec.theme');
        var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.background = dark ? '#131316' : '#FAFAF9';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        // Point the icons at the dark mark before first paint, so a dark-mode
        // load never shows the light favicon first.
        if (dark) {
          var links = document.querySelectorAll('link[data-favicon]');
          for (var i = 0; i < links.length; i++) {
            links[i].href = '/favicon-dark-' + links[i].getAttribute('data-favicon') + '.png';
          }
        }
      } catch (e) { /* storage blocked — the CSS above already handles it */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@200..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root">
    <!-- Boot splash: shown until React mounts and replaces #root's children.
         Self-contained so it paints before the bundle loads. -->
    <div id="boot-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;">
      <style>
        @keyframes plDrawHex{0%{stroke-dashoffset:1400;opacity:.4}50%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-1400;opacity:.4}}
        @keyframes plBreatheLeft{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
        @keyframes plBreatheRight{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
        @keyframes plType{0%{stroke-dashoffset:100;opacity:0}30%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-100;opacity:0}}
        @keyframes plPulse{0%,100%{transform:scale(0);opacity:0}30%,75%{transform:scale(1.3);opacity:1}85%{transform:scale(1);opacity:.8}}
        #boot-splash .h{stroke-dasharray:1400;stroke-dashoffset:1400;animation:plDrawHex 3.5s cubic-bezier(.4,0,.2,1) infinite;transform-origin:center}
        #boot-splash .bl{transform-origin:176px 258px;animation:plBreatheLeft 2.5s ease-in-out infinite}
        #boot-splash .br{transform-origin:336px 258px;animation:plBreatheRight 2.5s ease-in-out infinite}
        #boot-splash .l{stroke-dasharray:100;stroke-dashoffset:100;animation:plType 2.5s ease-out infinite}
        #boot-splash .l2{animation-delay:.5s}#boot-splash .l3{animation-delay:.8s}
        #boot-splash .d{transform-origin:290px 298px;animation:plPulse 2.5s ease-in-out infinite;animation-delay:1.1s}
        @media (prefers-reduced-motion:reduce){#boot-splash .h,#boot-splash .l{stroke-dashoffset:0;animation:none}#boot-splash .bl,#boot-splash .br,#boot-splash .d{animation:none}#boot-splash .d{opacity:1;transform:none}}
      </style>
      <svg width="120" height="120" viewBox="0 0 512 512" style="filter:drop-shadow(0 0 16px rgba(128,148,216,.25))" aria-label="Loading Parsec">
        <g fill="none" stroke="#8094D8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
          <path class="h" d="M 283.7 96 L 380.7 152 Q 408.4 168 408.4 200 L 408.4 312 Q 408.4 344 380.7 360 L 283.7 416 Q 256 432 228.3 416 L 131.3 360 Q 103.6 344 103.6 312 L 103.6 200 Q 103.6 168 131.3 152 L 228.3 96 Q 256 80 283.7 96 Z"/>
          <path class="bl" d="M 202 174 C 187 174, 176 181, 176 196 L 176 230 C 176 244, 166 254, 152 258 C 166 262, 176 272, 176 286 L 176 320 C 176 335, 187 342, 202 342"/>
          <path class="br" d="M 310 174 C 325 174, 336 181, 336 196 L 336 230 C 336 244, 346 254, 360 258 C 346 262, 336 272, 336 286 L 336 320 C 336 335, 325 342, 310 342"/>
          <path class="l l1" d="M 208 230 H 308"/>
          <path class="l l2" d="M 208 264 H 302"/>
          <path class="l l3" d="M 208 298 H 264"/>
        </g>
        <circle class="d" cx="290" cy="298" r="8" fill="#8094D8"/>
      </svg>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
